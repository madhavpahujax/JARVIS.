<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>J.A.R.V.I.S.</title>
<meta name="theme-color" content="#05080f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="JARVIS"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#05080f;color:#c8d6e5;font-family:'Rajdhani',sans-serif}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1a2035;border-radius:3px}
input::placeholder,textarea::placeholder{color:#3d4f6f}
a{color:var(--ac)}

:root{--ac:#00d4ff;--bg:#05080f;--card:#0b1120;--border:#131e35;--text:#c8d6e5;--dim:#4a5e82;--input:#0e1628}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dots{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,60,60,.35)}50%{box-shadow:0 0 0 10px rgba(255,60,60,0)}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
@keyframes speakPulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.45}30%{transform:translate(-50%,-50%) scale(1.35);opacity:.9}60%{transform:translate(-50%,-50%) scale(.92);opacity:.5}100%{transform:translate(-50%,-50%) scale(1);opacity:.45}}
@keyframes glow{0%,100%{box-shadow:0 0 25px var(--ac)22,0 0 50px var(--ac)0a}50%{box-shadow:0 0 45px var(--ac)44,0 0 90px var(--ac)18}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── LAYOUT ── */
#app{display:flex;height:100dvh;width:100vw;background:var(--bg)}
#sidebar{width:280px;min-width:280px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .25s,min-width .25s;overflow:hidden;z-index:10}
#sidebar.closed{width:0;min-width:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0}

/* ── SIDEBAR ── */
.sb-head{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--ac)15,var(--ac)05);border:1px solid var(--ac)25;display:grid;place-items:center;font-size:15px}
.sb-logo h1{font-family:'Orbitron',sans-serif;font-weight:800;font-size:15px;letter-spacing:.18em;color:var(--ac)}
.sb-logo small{display:block;font-size:9px;color:var(--dim);letter-spacing:.12em;font-weight:600;margin-top:1px}
.sb-agents{flex:1;overflow-y:auto;padding:10px}
.sb-label{color:var(--dim);font-weight:700;font-size:10px;letter-spacing:.18em;padding:6px 8px 8px}
.ag{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;transition:all .2s;position:relative}
.ag:hover{background:rgba(255,255,255,.02);border-color:var(--border)}
.ag.on{background:rgba(255,255,255,.03);border-color:var(--ac)22}
.ag.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2.5px;border-radius:0 2px 2px 0}
.ag-ico{font-size:20px;flex-shrink:0;opacity:.6;transition:opacity .2s}.ag.on .ag-ico{opacity:1}
.ag-name{font-weight:700;font-size:12.5px;letter-spacing:.04em;color:var(--dim);line-height:1.2;transition:color .2s}.ag.on .ag-name{color:var(--text)}
.ag-desc{font-size:10px;color:var(--dim);opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ag .del{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:5px;background:rgba(255,50,50,.08);border:1px solid rgba(255,50,50,.18);color:#ff5050;font-size:11px;cursor:pointer;display:none;place-items:center}.ag.on .del.yes{display:grid}
.sb-foot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sb-btn{width:100%;padding:10px;border-radius:10px;cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.08em;text-align:center;transition:all .2s}
.sb-add{background:transparent;border:1px dashed var(--ac)30;color:var(--ac)}
.sb-key{background:transparent;border:1px solid var(--border);color:var(--dim);font-size:11px}

/* ── HEADER ── */
#hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card);min-height:52px}
.hdr-menu{background:none;border:1px solid var(--border);border-radius:7px;color:var(--dim);cursor:pointer;padding:5px 9px;font-size:15px;flex-shrink:0}
.hdr-info{flex:1;min-width:0;overflow:hidden}
.hdr-name{font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-desc{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-actions{display:flex;gap:5px;align-items:center;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:55%}
.hdr-actions::-webkit-scrollbar{display:none}
.hbtn{padding:5px 10px;border-radius:7px;font-size:10px;font-weight:700;letter-spacing:.06em;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);white-space:nowrap;flex-shrink:0;transition:all .15s}
.hbtn.on{border-color:var(--ac)44;color:var(--ac);background:var(--ac)0a}
.hsel{padding:4px 6px;border-radius:7px;font-size:10px;font-weight:700;background:var(--input);border:1px solid var(--border);color:var(--dim);cursor:pointer;outline:none;flex-shrink:0}

/* ── CHAT ── */
#chat{flex:1;overflow-y:auto;padding:16px 16px 8px}
.msg{display:flex;margin-bottom:12px;animation:fadeUp .25s}
.msg.u{justify-content:flex-end}.msg.a{justify-content:flex-start}
.bub{max-width:80%;padding:10px 14px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;font-family:'IBM Plex Mono',monospace}
.msg.u .bub{background:var(--input);border:1px solid var(--border);border-radius:14px 14px 3px 14px;color:var(--text)}
.msg.a .bub{background:var(--ac)06;border:1px solid var(--ac)15;border-radius:14px 14px 14px 3px;color:var(--text)}
.spk{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:2px 7px;border-radius:6px;cursor:pointer;font-size:10px;font-weight:700;border:1px solid var(--ac)25;background:var(--ac)08;color:var(--ac);vertical-align:middle}
.spk:active{opacity:.6}
.dots{display:flex;gap:5px;padding:10px 14px;margin-bottom:12px}
.dots span{width:6px;height:6px;border-radius:50%;animation:dots 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.stop-btn{display:block;margin:6px auto;padding:6px 18px;border-radius:8px;background:rgba(255,50,50,.1);border:1px solid rgba(255,50,50,.3);color:#ff5050;cursor:pointer;font-weight:700;font-size:11px;letter-spacing:.06em}

/* ── INPUT ── */
#inp{padding:8px 14px 14px}
.inp-box{display:flex;gap:8px;align-items:flex-end;background:var(--input);border:1px solid var(--border);border-radius:14px;padding:6px 6px 6px 14px;transition:border-color .2s}
.inp-box:focus-within{border-color:var(--ac)33}
.inp-box textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;resize:none;line-height:1.5;max-height:100px}
.mic{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--border);font-size:16px;cursor:pointer;transition:all .2s;display:grid;place-items:center;flex-shrink:0}
.mic.rec{background:rgba(255,60,60,.15);border-color:#ff3c3c;animation:micPulse .9s ease-in-out infinite}
.snd{padding:8px 16px;border-radius:10px;font-weight:700;font-size:12px;letter-spacing:.08em;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--card);color:var(--dim);flex-shrink:0}

/* ── ORB ── */
.orb-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.orb-box{position:relative;width:200px;height:200px}
.orb-box:active{transform:scale(.96)}
.orb-outer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:140px;height:140px;border-radius:50%;transition:all .4s}
.orb-outer.speaking{animation:glow .5s ease-in-out infinite}
.orb-core{position:absolute;top:50%;left:50%;width:46px;height:46px;border-radius:50%;transform:translate(-50%,-50%);animation:breathe 4s ease-in-out infinite;transition:all .3s}
.orb-core.speaking{animation:speakPulse .32s ease-in-out infinite;width:56px;height:56px}
.orb-core.listening{animation:breathe 1.1s ease-in-out infinite;width:52px;height:52px}
.orb-label{text-align:center;margin-top:8px;font-family:'Orbitron',sans-serif;font-weight:600;font-size:9px;letter-spacing:.22em;text-transform:uppercase}
.orb-label.listening{color:#ff3c3c;animation:blink .9s ease-in-out infinite}
.orb-label.speaking{color:var(--ac)}
.orb-label.thinking{color:#f0a030;animation:blink .7s ease-in-out infinite}

/* ── KNOWLEDGE ── */
.kp{padding:16px}
.kp-title{font-weight:700;font-size:14px;letter-spacing:.08em;margin-bottom:12px}
.kp-row{display:flex;gap:6px;margin-bottom:12px}
.kp-in{flex:1;padding:9px 12px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none}
.kp-in:focus{border-color:var(--ac)33}
.kp-add{padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12px;border:1px solid;background:transparent;white-space:nowrap}
.kp-item{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;background:var(--input);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.kp-idx{font-size:9px;margin-top:2px;font-family:'Orbitron',sans-serif;font-weight:600}
.kp-txt{flex:1;color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.5}
.kp-del{background:none;border:none;color:rgba(255,50,50,.45);cursor:pointer;font-size:13px;padding:0 2px}

/* ── MODALS ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(12px);animation:fadeIn .2s}
.md{width:92%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;max-height:88vh;overflow-y:auto}
.md h2{color:var(--ac);font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:.1em;margin-bottom:20px;text-align:center}
.md label{display:block;color:var(--dim);font-weight:700;font-size:10px;letter-spacing:.14em;margin-bottom:5px}
.md input,.md textarea{width:100%;padding:9px 12px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:14px;outline:none}
.md input:focus,.md textarea:focus{border-color:var(--ac)33}
.md textarea{height:80px;resize:vertical}
.ig,.cg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ib{width:36px;height:36px;border-radius:8px;font-size:18px;background:transparent;border:1px solid var(--border);cursor:pointer;display:grid;place-items:center}.ib.on{background:var(--input);border-color:var(--ac)33}
.cb{width:28px;height:28px;border-radius:50%;border:2px solid #333;cursor:pointer}.cb.on{border:2.5px solid white}
.md-act{display:flex;gap:10px;margin-top:20px}
.md-act button{flex:1;padding:10px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px}
.md-cancel{background:var(--input);border:1px solid var(--border);color:var(--dim)}
.md-go{border:1px solid;background:transparent}

@media(max-width:768px){
  #sidebar{position:fixed;height:100dvh;width:260px;min-width:260px}
  #sidebar.closed{width:0;min-width:0}
  .bub{max-width:88%!important;font-size:12px}
  .hdr-name{font-size:12px}
  .hdr-desc{display:none}
  .orb-box{width:160px;height:160px}
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sb-head"><div class="sb-logo"><div class="sb-logo-mark">⚡</div><div><h1>J.A.R.V.I.S.</h1><small>MULTI-AGENT SYSTEM v1.0 IRON</small></div></div></div>
    <div class="sb-agents"><div class="sb-label">AGENTS <span id="agent-count">5</span></div><div id="agent-cards"></div></div>
    <div class="sb-foot">
      <button class="sb-btn sb-add" onclick="openCreateModal()">+ New Agent</button>
      <button class="sb-btn sb-key" onclick="showApiKeyModal()">🔑 API Key</button>
    </div>
  </div>
  <div id="main">
    <div id="hdr">
      <button class="hdr-menu" onclick="toggleSidebar()">☰</button>
      <span id="h-icon" style="font-size:20px;flex-shrink:0"></span>
      <div class="hdr-info"><div class="hdr-name" id="h-name"></div><div class="hdr-desc" id="h-desc"></div></div>
      <div class="hdr-actions">
        <button class="hbtn on" id="tab-chat" onclick="switchView('chat')">Chat</button>
        <button class="hbtn" id="tab-knowledge" onclick="switchView('knowledge')">Memory</button>
        <button class="hbtn" id="tab-clear" onclick="clearChat()" style="color:#ff5050;border-color:rgba(255,50,50,.2)">Clear</button>
        <select class="hsel" id="voice-select" onchange="setAgentVoice(activeAgent,this.value);render();"></select>
      </div>
    </div>
    <div id="chat-view" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div id="chat"></div>
      <div id="inp"><div class="inp-box" id="input-box">
        <textarea id="msg-input" rows="1" placeholder="Ask anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button class="mic" id="mic-btn" onclick="toggleVoice()">🎤</button>
        <button class="snd" id="send-btn" onclick="sendMessage()">Send</button>
      </div></div>
    </div>
    <div id="knowledge-view" style="flex:1;overflow:auto;display:none">
      <div class="kp">
        <div class="kp-title" id="k-title">Knowledge Base</div>
        <div class="kp-row"><input class="kp-in" id="k-input" placeholder="Store information..." onkeydown="if(event.key==='Enter'&&this.value.trim()){addKnowledge(this.value.trim());this.value='';}" /><button class="kp-add" id="k-add-btn" onclick="let v=document.getElementById('k-input');if(v.value.trim()){addKnowledge(v.value.trim());v.value='';}">+ Add</button></div>
        <div id="k-items"></div>
      </div>
    </div>
  </div>
</div>

<div class="ov" id="create-modal" style="display:none" onclick="closeCreateModal()"><div class="md" onclick="event.stopPropagation()">
  <h2>New Agent</h2>
  <label>NAME</label><input id="ca-name" placeholder="e.g. Music Guru"/>
  <label>ICON</label><div class="ig" id="ca-icons"></div>
  <label>COLOUR</label><div class="cg" id="ca-colors"></div>
  <label>DESCRIPTION</label><input id="ca-desc" placeholder="What does this agent do?"/>
  <label>INSTRUCTIONS</label><textarea id="ca-prompt" placeholder="Tell this agent how to behave..."></textarea>
  <div class="md-act"><button class="md-cancel" onclick="closeCreateModal()">Cancel</button><button class="md-go" id="ca-deploy" onclick="deployAgent()">Deploy</button></div>
</div></div>
<div class="ov" id="api-modal" style="display:none"><div class="md">
  <h2>Connect AI</h2>
  <p style="color:var(--dim);font-size:11px;font-family:'IBM Plex Mono',monospace;margin-bottom:16px;line-height:1.6;text-align:center">Get a free Gemini API key at<br><a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></p>
  <label>API KEY</label><input id="api-key-input" placeholder="AIza..." style="font-size:11px"/>
  <p style="color:var(--dim);font-size:9px;margin-top:-8px;margin-bottom:14px;opacity:.6">Stored only on your device.</p>
  <div class="md-act"><button class="md-go" style="background:var(--ac)10;border-color:var(--ac)33;color:var(--ac)" onclick="saveApiKey()">Activate</button></div>
</div></div>

<script>
const DEFAULT_AGENTS=[
  {id:"jarvis-core",name:"J.A.R.V.I.S.",icon:"🧠",color:"#00d4ff",description:"Core intelligence — all-purpose AI with internet access.",systemPrompt:"You are J.A.R.V.I.S., a hyper-intelligent AI assistant modelled after the AI from Iron Man. You can do EVERYTHING: answer questions, write code, solve maths, write essays, explain science, give advice, plan, debug, translate. You have internet access via Google Search for real-time info. Be concise and precise. Speak like a refined British AI butler. Address the user as 'Sir'.",locked:true},
  {id:"football-analyst",name:"Pitch Intel",icon:"⚽",color:"#00ff88",description:"Football analysis — tactics, stats, live scores.",systemPrompt:"You are Pitch Intel inside J.A.R.V.I.S. Fully capable AI, specialty is football — tactics, stats, predictions, live scores. Internet access for real-time data. Help with anything asked."},
  {id:"football-news",name:"Transfer Wire",icon:"📰",color:"#ff6b35",description:"Football news — transfers, results, breaking stories.",systemPrompt:"You are Transfer Wire inside J.A.R.V.I.S. Fully capable AI, specialty is football news — transfers, results, injuries, breaking news. Internet access for latest info. Help with anything asked."},
  {id:"study-assistant",name:"Scholar",icon:"📚",color:"#a855f7",description:"Study assistant — homework, revision, research.",systemPrompt:"You are Scholar inside J.A.R.V.I.S. Fully capable AI, specialty is education — notes, revision, homework, exams, research. Internet access. Be encouraging. Help with anything asked."},
  {id:"school-manager",name:"Campus",icon:"🏫",color:"#f59e0b",description:"School organiser — timetable, assignments, deadlines.",systemPrompt:"You are Campus inside J.A.R.V.I.S. Fully capable AI, specialty is school organisation — timetables, assignments, deadlines. Internet access. Be proactive. Help with anything asked."},
];
const ICONS=["🤖","🎯","🔬","🎮","🏋️","🎵","💡","🌍","📊","🛡️","🚀","🎨","💰","🧪","📱"];
const COLORS=["#00d4ff","#00ff88","#ff6b35","#a855f7","#f59e0b","#ef4444","#ec4899","#14b8a6"];
const MODELS=['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-2.0-flash-lite'];

let agents=JSON.parse(localStorage.getItem('jv_agents'))||[...DEFAULT_AGENTS];
let activeAgent=agents[0].id,conversations=JSON.parse(localStorage.getItem('jv_convos'))||{},knowledge=JSON.parse(localStorage.getItem('jv_knowledge'))||[];
let apiKey=localStorage.getItem('jv_api_key')||'',currentView='chat',loading=false,sidebarOpen=true;
let caIcon="🤖",caColor="#00d4ff";
let recognition=null,isRecording=false,voiceMode=false,isSpeaking=false,silenceTimer=null;

const VOICE_PRESETS=[
  {id:'friday',label:'Friday',gender:'female',pitch:1.4,rate:1.05,keywords:['Female','Zira','Hazel','Karen','Samantha','Google UK English Female','Victoria']},
  {id:'arjun',label:'Arjun',gender:'male',pitch:0.6,rate:0.9,keywords:['Male','David','Daniel','James','Google UK English Male','Alex','Fred']},
  {id:'nova',label:'Nova',gender:'female',pitch:1.1,rate:1.0,keywords:['Female','Fiona','Moira','Google US English','Samantha','Zira','Karen']},
  {id:'titan',label:'Titan',gender:'male',pitch:0.85,rate:0.95,keywords:['Male','George','Richard','Google UK English Male','David','Daniel','Thomas']},
];
let agentVoices=JSON.parse(localStorage.getItem('jv_agent_voices'))||{};
function getAgentVoice(id){return agentVoices[id]||(id==='jarvis-core'?'arjun':'friday')}
function setAgentVoice(id,v){agentVoices[id]=v;localStorage.setItem('jv_agent_voices',JSON.stringify(agentVoices))}
function save(){localStorage.setItem('jv_agents',JSON.stringify(agents));localStorage.setItem('jv_convos',JSON.stringify(conversations));localStorage.setItem('jv_knowledge',JSON.stringify(knowledge))}
function getAgent(){return agents.find(a=>a.id===activeAgent)||agents[0]}
function getMessages(){return conversations[activeAgent]||[]}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escJs(s){return s.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$')}

// ── RENDER ──
function render(){
  const a=getAgent(),msgs=getMessages();
  document.documentElement.style.setProperty('--ac',a.color);
  document.getElementById('agent-count').textContent=agents.length;
  document.getElementById('agent-cards').innerHTML=agents.map(ag=>`<div class="ag ${ag.id===activeAgent?'on':''}" onclick="setActiveAgent('${ag.id}')" style="${ag.id===activeAgent?'--ac:'+ag.color:''}"><div class="ag-ico">${ag.icon}</div><div style="flex:1;min-width:0"><div class="ag-name">${ag.name}</div><div class="ag-desc">${ag.description}</div></div>${!ag.locked?`<button class="del ${ag.id===activeAgent?'yes':''}" onclick="event.stopPropagation();deleteAgent('${ag.id}')">×</button>`:''}</div>`).join('');
  document.getElementById('h-icon').textContent=a.icon;
  document.getElementById('h-name').textContent=a.name;document.getElementById('h-name').style.color=a.color;
  document.getElementById('h-desc').textContent=a.description;
  ['chat','knowledge'].forEach(v=>{const b=document.getElementById('tab-'+v);b.className='hbtn'+(currentView===v?' on':'')});
  document.getElementById('chat-view').style.display=currentView==='chat'?'flex':'none';
  document.getElementById('knowledge-view').style.display=currentView==='knowledge'?'block':'none';
  const vSel=document.getElementById('voice-select'),cv=getAgentVoice(activeAgent);
  vSel.innerHTML=VOICE_PRESETS.map(p=>`<option value="${p.id}"${p.id===cv?' selected':''}>${p.label}</option>`).join('');
  if(!isRecording)document.getElementById('msg-input').placeholder=`Ask ${a.name} anything...`;
  const sb=document.getElementById('send-btn'),has=document.getElementById('msg-input').value.trim();
  sb.style.background=has?`${a.color}18`:'';sb.style.borderColor=has?`${a.color}44`:'';sb.style.color=has?a.color:'';

  const ca=document.getElementById('chat');
  if(msgs.length===0){
    ca.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px"><div class="orb-wrap" onclick="toggleVoice()"><div class="orb-box">${renderOrb(a.color)}</div><div class="orb-label" id="orb-status" style="color:${a.color}">Tap to speak</div></div></div>`;
    setTimeout(()=>{startOrbAnim();updateOrb()},60);
  } else {
    let h=`<div style="display:flex;justify-content:center;margin-bottom:4px"><div class="orb-wrap" onclick="toggleVoice()" style="transform:scale(.4);margin:-36px 0 -30px"><div class="orb-box">${renderOrb(a.color)}</div></div></div>`;
    h+=`<div class="orb-label" id="orb-status" style="color:${a.color};margin-bottom:10px;text-align:center">${statusText()}</div>`;
    h+=msgs.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}"><div class="bub">${esc(m.content)}${m.role==='assistant'?`<button class="spk" onclick="speakAnim(\`${escJs(m.content)}\`)">🔊</button>`:''}</div></div>`).join('');
    if(loading)h+=`<div class="dots"><span style="background:${a.color}"></span><span style="background:${a.color}"></span><span style="background:${a.color}"></span></div>`;
    if(isSpeaking)h+=`<button class="stop-btn" onclick="stopSpeaking()">⏹ Stop</button>`;
    ca.innerHTML=h;ca.scrollTop=ca.scrollHeight;
    setTimeout(()=>{startOrbAnim();updateOrb()},60);
  }

  document.getElementById('k-title').style.color=a.color;
  const kab=document.getElementById('k-add-btn');kab.style.borderColor=`${a.color}44`;kab.style.color=a.color;
  document.getElementById('k-items').innerHTML=knowledge.length===0?`<p style="color:var(--dim);font-size:11px">No data stored yet.</p>`:knowledge.map((item,i)=>`<div class="kp-item"><span class="kp-idx" style="color:${a.color}">${i+1}</span><span class="kp-txt">${esc(item)}</span><button class="kp-del" onclick="deleteKnowledge(${i})">×</button></div>`).join('');
}

// ── 3D ORB ──
function renderOrb(c){
  return `<canvas id="orb-canvas" width="200" height="200" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px"></canvas><div class="orb-outer" id="orb-outer" style="background:radial-gradient(circle at 40% 35%,${c}18,transparent 65%)"></div><div class="orb-core" id="orb-core" style="background:radial-gradient(circle at 38% 38%,${c}ee,${c}88 35%,${c}33 65%,transparent)"></div>`;
}
let orbAF=null,orbT=0;
function startOrbAnim(){
  function draw(){
    const cv=document.getElementById('orb-canvas');
    if(!cv){orbAF=requestAnimationFrame(draw);return}
    const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,cx=W/2,cy=H/2;
    ctx.clearRect(0,0,W,H);
    const a=getAgent(),c=a.color,pr=VOICE_PRESETS.find(p=>p.id===getAgentVoice(activeAgent))||VOICE_PRESETS[0];
    orbT+=isSpeaking?.1:.012;
    const R=parseInt(c.slice(1,3),16),G=parseInt(c.slice(3,5),16),B=parseInt(c.slice(5,7),16);

    // 3D ambient shadow under orb
    const grd=ctx.createRadialGradient(cx,cy+8,20,cx,cy+8,90);
    grd.addColorStop(0,`rgba(${R},${G},${B},.06)`);grd.addColorStop(1,'transparent');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

    // Thick continuous rings with 3D perspective bulge
    const layers=[
      {r:88,w:isSpeaking?4.5:2.5,op:.65,spd:1,bulge:isSpeaking?16:2.5},
      {r:76,w:isSpeaking?3:1.8,op:.35,spd:-.65,bulge:isSpeaking?10:1.5},
      {r:64,w:isSpeaking?2:1.2,op:.2,spd:.45,bulge:isSpeaking?6:1},
    ];

    for(const L of layers){
      // Draw ring path with smooth bulges
      ctx.beginPath();
      const pts=80;
      for(let i=0;i<=pts;i++){
        const ang=(i/pts)*Math.PI*2;
        const f1=Math.sin(ang*2+orbT*L.spd*2.5)*.5+.5;
        const f2=Math.sin(ang*4-orbT*L.spd*3.5)*.3;
        const f3=Math.sin(ang*6+orbT*L.spd*1.8)*.2;
        // 3D effect: slight vertical compression
        const bAmt=L.bulge*(f1+f2+f3);
        const rr=L.r+bAmt;
        const x=cx+Math.cos(ang)*rr;
        const y=cy+Math.sin(ang)*rr*.92; // 3D squish
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.lineWidth=L.w;
      ctx.strokeStyle=`rgba(${R},${G},${B},${L.op})`;
      ctx.stroke();

      // Glow on outer ring when speaking
      if(L===layers[0]&&isSpeaking){
        ctx.lineWidth=L.w+5;ctx.strokeStyle=`rgba(${R},${G},${B},.12)`;ctx.stroke();
        ctx.lineWidth=L.w+12;ctx.strokeStyle=`rgba(${R},${G},${B},.04)`;ctx.stroke();
      }
    }

    // 3D highlight arc on top (gives sphere illusion)
    ctx.beginPath();
    ctx.arc(cx,cy-2,44,Math.PI*1.15,Math.PI*1.85);
    ctx.lineWidth=1;
    ctx.strokeStyle=`rgba(${R},${G},${B},.08)`;
    ctx.stroke();

    // Listening indicator
    if(isRecording){
      ctx.beginPath();
      const pr2=84+Math.sin(orbT*3)*6;
      for(let i=0;i<=64;i++){const ang=(i/64)*Math.PI*2;ctx.lineTo(cx+Math.cos(ang)*pr2,cy+Math.sin(ang)*pr2*.92)}
      ctx.closePath();ctx.lineWidth=3;ctx.strokeStyle=`rgba(255,60,60,${.35+Math.sin(orbT*4)*.25})`;ctx.stroke();
    }
    orbAF=requestAnimationFrame(draw);
  }
  if(orbAF)cancelAnimationFrame(orbAF);draw();
}

function statusText(){if(isRecording)return'Listening…';if(loading)return'Thinking…';if(isSpeaking)return'Speaking — tap to stop';return'Ready'}
function updateOrb(){
  const o=document.getElementById('orb-outer'),c=document.getElementById('orb-core'),s=document.getElementById('orb-status');
  if(!o||!c)return;
  o.className='orb-outer'+(isSpeaking?' speaking':'');
  c.className='orb-core'+(isSpeaking?' speaking':'')+(isRecording?' listening':'');
  if(s){s.textContent=statusText();s.className='orb-label'+(isRecording?' listening':'')+(isSpeaking?' speaking':'')+(loading?' thinking':'')}
}
setInterval(()=>{startOrbAnim()},600);

// ── ACTIONS ──
function setActiveAgent(id){activeAgent=id;currentView='chat';if(window.innerWidth<=768)sidebarOpen=false;updSB();render()}
function switchView(v){currentView=v;render()}
function toggleSidebar(){sidebarOpen=!sidebarOpen;updSB()}
function updSB(){document.getElementById('sidebar').className=sidebarOpen?'':'closed'}
function deleteAgent(id){const a=agents.find(x=>x.id===id);if(a?.locked)return;if(!confirm(`Delete "${a.name}"?`))return;agents=agents.filter(x=>x.id!==id);delete conversations[id];if(activeAgent===id)activeAgent=agents[0].id;save();render()}
function addKnowledge(t){knowledge.push(t);save();render()}
function deleteKnowledge(i){knowledge.splice(i,1);save();render()}
function clearChat(){if(!confirm('Clear chat? Knowledge stays.'))return;conversations[activeAgent]=[];save();render()}

// ── TTS ──
function stopSpeaking(){speechSynthesis.cancel();isSpeaking=false;updateOrb();render()}
function findBestVoice(preset){const voices=speechSynthesis.getVoices();if(!voices.length)return null;for(const kw of preset.keywords){const m=voices.find(v=>v.name.includes(kw)&&v.lang.startsWith('en'));if(m)return m}const ev=voices.filter(v=>v.lang.startsWith('en'));if(preset.gender==='female'){const f=ev.find(v=>v.name.toLowerCase().includes('female'));if(f)return f}else{const m=ev.find(v=>v.name.toLowerCase().includes('male'));if(m)return m}return ev[0]||voices[0]}
function speakAnim(text){
  speechSynthesis.cancel();isSpeaking=true;render();
  const preset=VOICE_PRESETS.find(p=>p.id===getAgentVoice(activeAgent))||VOICE_PRESETS[0];
  const u=new SpeechSynthesisUtterance(text);
  const hD=/[\u0900-\u097F]/.test(text),hA=/[\u0600-\u06FF]/.test(text),hC=/[\u4e00-\u9fff]/.test(text),hJ=/[\u3040-\u30ff]/.test(text),hK=/[\uac00-\ud7af]/.test(text),hR=/[\u0400-\u04FF]/.test(text);
  u.lang=hD?'hi-IN':hA?'ar-SA':hC?'zh-CN':hJ?'ja-JP':hK?'ko-KR':hR?'ru-RU':'en-GB';
  u.rate=preset.rate;u.pitch=preset.pitch;
  const voices=speechSynthesis.getVoices(),lv=voices.filter(v=>v.lang.startsWith(u.lang.split('-')[0]));
  if(lv.length){const g=preset.gender==='female'?lv.find(v=>v.name.toLowerCase().includes('female')):lv.find(v=>v.name.toLowerCase().includes('male'));u.voice=g||lv[0]}else{const bv=findBestVoice(preset);if(bv)u.voice=bv}
  u.onend=()=>{isSpeaking=false;updateOrb();render()};u.onerror=()=>{isSpeaking=false;updateOrb();render()};
  speechSynthesis.speak(u);
}
speechSynthesis.getVoices();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

// ── VOICE INPUT ──
function initVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice needs Chrome or Edge.');return false}recognition=new SR();try{recognition.lang=''}catch(e){recognition.lang='en-US'}recognition.continuous=false;recognition.interimResults=true;let ft='';recognition.onresult=e=>{let it='';ft='';for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)ft+=e.results[i][0].transcript+' ';else it+=e.results[i][0].transcript}document.getElementById('msg-input').value=(ft+it).trim();clearTimeout(silenceTimer);silenceTimer=setTimeout(()=>{if(isRecording)recognition.stop()},1500)};recognition.onend=()=>{clearTimeout(silenceTimer);const t=document.getElementById('msg-input').value.trim();if(isRecording&&t){voiceMode=true;stopRec();sendMessage()}else{stopRec()}};recognition.onerror=e=>{if(e.error==='not-allowed')alert('Allow microphone access.');stopRec()};return true}
function toggleVoice(){if(isSpeaking){stopSpeaking();return}if(isRecording){recognition.stop();return}startRec()}
function startRec(){if(!recognition&&!initVoice())return;document.getElementById('msg-input').value='';isRecording=true;document.getElementById('mic-btn').classList.add('rec');document.getElementById('mic-btn').textContent='🔴';document.getElementById('msg-input').placeholder='Listening…';updateOrb();try{recognition.start()}catch(e){recognition.stop();setTimeout(()=>{try{recognition.start()}catch(e2){}},200)}}
function stopRec(){isRecording=false;document.getElementById('mic-btn').classList.remove('rec');document.getElementById('mic-btn').textContent='🎤';document.getElementById('msg-input').placeholder=`Ask ${getAgent().name} anything...`;updateOrb()}

// ── AI ──
async function tryModel(m,sys,c){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:c,generationConfig:{maxOutputTokens:2048,temperature:.8},tools:[{google_search:{}}]})});const d=await r.json();if(d.candidates?.[0]?.content?.parts)return{ok:true,reply:d.candidates[0].content.parts.map(p=>p.text||'').join('')};if(d.error){const msg=d.error.message||'';if(msg.includes('high demand')||msg.includes('overloaded')||msg.includes('quota')||msg.includes('429')||msg.includes('not found')||msg.includes('not supported'))return{ok:false,retry:true,error:msg};return{ok:false,retry:false,error:msg}}return{ok:false,retry:true,error:'Unknown'}}
async function sendMessage(){const input=document.getElementById('msg-input'),text=input.value.trim();if(!text||loading)return;if(!apiKey){showApiKeyModal();return}const a=getAgent();if(!conversations[activeAgent])conversations[activeAgent]=[];conversations[activeAgent].push({role:'user',content:text});input.value='';loading=true;save();render();const kCtx=knowledge.length>0?`\n\nKnowledge base:\n${knowledge.map((k,i)=>`[${i+1}] ${k}`).join('\n')}`:'';const sys=a.systemPrompt+kCtx+'\n\nIMPORTANT: Respond in the same language the user speaks. Match their language. If unsure, use English.';const contents=conversations[activeAgent].slice(-20).map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.content}]}));try{let reply='',success=false;for(const model of MODELS){const r=await tryModel(model,sys,contents);if(r.ok){reply=r.reply;success=true;break}if(!r.retry){reply=`Error: ${r.error}`;break}}if(!success&&!reply)reply="All models busy, Sir. Try again shortly.";conversations[activeAgent].push({role:'assistant',content:reply});if(voiceMode&&reply&&!reply.startsWith('Error:')){loading=false;voiceMode=false;save();render();setTimeout(()=>speakAnim(reply),300);return}}catch(e){conversations[activeAgent].push({role:'assistant',content:"Connection disrupted."})}voiceMode=false;loading=false;save();render()}
document.getElementById('msg-input').addEventListener('input',()=>{const a=getAgent(),sb=document.getElementById('send-btn'),has=document.getElementById('msg-input').value.trim();sb.style.background=has?`${a.color}18`:'';sb.style.borderColor=has?`${a.color}44`:'';sb.style.color=has?a.color:''});

// ── MODALS ──
function openCreateModal(){caIcon='🤖';caColor='#00d4ff';document.getElementById('ca-name').value='';document.getElementById('ca-desc').value='';document.getElementById('ca-prompt').value='';rMO();document.getElementById('create-modal').style.display='flex'}
function closeCreateModal(){document.getElementById('create-modal').style.display='none'}
function rMO(){document.getElementById('ca-icons').innerHTML=ICONS.map(ic=>`<button class="ib ${ic===caIcon?'on':''}" onclick="caIcon='${ic}';rMO()">${ic}</button>`).join('');document.getElementById('ca-colors').innerHTML=COLORS.map(c=>`<button class="cb ${c===caColor?'on':''}" style="background:${c}" onclick="caColor='${c}';rMO();uD()"></button>`).join('');uD()}
function uD(){const b=document.getElementById('ca-deploy');b.style.background=`${caColor}15`;b.style.borderColor=`${caColor}44`;b.style.color=caColor}
function deployAgent(){const n=document.getElementById('ca-name').value.trim();if(!n){alert('Enter a name.');return}const d=document.getElementById('ca-desc').value.trim()||'Custom agent';const p=document.getElementById('ca-prompt').value.trim()||`You are ${n} inside J.A.R.V.I.S. Fully capable AI with internet access. Be helpful.`;agents.push({id:'c-'+Date.now(),name:n,icon:caIcon,color:caColor,description:d,systemPrompt:p,locked:false});activeAgent=agents[agents.length-1].id;currentView='chat';closeCreateModal();save();render()}
function showApiKeyModal(){document.getElementById('api-modal').style.display='flex'}
function saveApiKey(){const k=document.getElementById('api-key-input').value.trim();if(!k){alert('Enter your API key.');return}apiKey=k;localStorage.setItem('jv_api_key',apiKey);document.getElementById('api-modal').style.display='none';render()}

render();if(!apiKey)showApiKeyModal();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
